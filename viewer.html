<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rendered HTML preview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d1117; color: #e6edf3; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #bar { display: flex; align-items: center; gap: 1rem; padding: 0.5rem 1rem; background: #161b22; border-bottom: 1px solid #30363d; }
  #bar code { background: #21262d; padding: 0.1em 0.4em; border-radius: 4px; font-size: 0.85em; }
  #bar .spacer { flex: 1; }
  #bar small { color: #8b949e; }
  iframe { width: 100%; height: calc(100% - 42px); border: 0; background: white; }
  #err { padding: 2rem; color: #f85149; }
</style>
</head>
<body>
<div id="bar">
  <strong>gh-html-render</strong>
  <small>sandboxed preview · null origin · no github.com access</small>
  <span class="spacer"></span>
  <small id="size"></small>
</div>
<iframe id="frame" sandbox="allow-scripts allow-popups allow-forms allow-modals" referrerpolicy="no-referrer"></iframe>
<div id="err" hidden></div>
<script src="viewer.js"></script>
</body>
</html>
